<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div><h1>Counter:</h1></div>
    <div><h2 id="counter">0</h2></div>
    <button id="incrementBTN" onclick="increment()">Increase</button>
    <button id="decreaseBTN" onclick="decrease()">Decrease</button>
    <button id="saveBTN" onclick="save()">Save</button>
    <button id="resetBTN" onclick="reset()">Reset Counter</button>
    <button id="cleanBTN" onclick="clean()">Clean Saves</button>
    <br>
    <p id="saves">Saves: </p>
    <script src="index.js"></script>
</body>
</html>
